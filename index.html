<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C9C8F2" />
    <meta name="description" content="Личный читательский дневник" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reading Diary" />
    <script>
      // Тема до первой отрисовки: иначе светлая вспышка при тёмном режиме.
      ;(function () {
        try {
          var raw = localStorage.getItem('reading-diary:appearance')
          var saved = raw ? JSON.parse(raw) : {}
          var themes = ['lavender', 'shelf', 'diary', 'leopard', 'leopard-pink']
          var theme = themes.indexOf(saved.theme) >= 0 ? saved.theme : 'lavender'
          var mode =
            saved.themeMode === 'dark' ||
            saved.themeMode === 'light' ||
            saved.themeMode === 'system'
              ? saved.themeMode
              : 'light'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = theme === 'leopard-pink' ? 'leopard' : theme
          if (theme === 'leopard-pink') root.dataset.leopard = 'pink'
          root.dataset.mode = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
          var colors = {
            lavender: ['#C9C8F2', '#171326'],
            shelf: ['#F2E9D9', '#171210'],
            diary: ['#F8F2E4', '#1E1B15'],
            leopard: ['#F3EBDD', '#14100E'],
            'leopard-pink': ['#F4C6E2', '#160B12'],
          }
          root.style.backgroundColor = colors[theme][dark ? 1 : 0]
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = colors[theme][dark ? 1 : 0]
        } catch (error) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <title>Reading Diary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
